name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # Any request to the project URL wakes/keeps the DB alive
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hpzldwiddtmabhnztfbe.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $STATUS"
          # 2xx/4xx both count as activity — only 5xx/network failure is bad
          if [ "$STATUS" -ge 500 ] || [ "$STATUS" -eq 000 ]; then
            echo "✗ Supabase unreachable ($STATUS)"
            exit 1
          fi
          echo "✓ Supabase pinged — project kept alive"
